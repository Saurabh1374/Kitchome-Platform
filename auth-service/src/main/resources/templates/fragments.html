<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | KitChome'">KitChome</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script th:src="@{/js/jquery-3.6.0.min.js}"></script>
    <script>
        if (typeof jQuery === 'undefined') {
            document.write('<script src="https://code.jquery.com/jquery-3.6.0.min.js"><\/script>');
        }
    </script>
</head>

<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="glass"
        style="position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
        <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem;">
            <div
                style="width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <span style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.02em;">Kit<span class="text-gradient">Chome</span></span>
        </a>
        <div id="nav-actions" style="display: flex; gap: 1rem; align-items: center;">
            <th:block th:if="${!isAuthenticated}">
                <a href="/login" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Login</a>
                <a href="/register" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Get Started</a>
            </th:block>
            <th:block th:if="${isAuthenticated}">
                <a href="/dashboard" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Dashboard</a>
                <form th:action="@{/api/v1/auth/logout}" method="post" style="margin: 0;" id="logoutForm">
                    <button type="submit" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem; border-color: var(--danger); color: var(--danger);">Logout</button>
                </form>
            </th:block>
        </div>
    </nav>
    <!-- Sidebar Fragment (for Dashboard) -->
    <aside th:fragment="sidebar" class="glass"
        style="width: 260px; height: calc(100vh - 4rem); position: sticky; top: 5rem; border-radius: 20px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
        <a th:href="@{/dashboard}" class="btn btn-outline sidebar-link"
            style="justify-content: flex-start; border: none; width: 100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
        </a>
        <a th:href="@{/dashboard#services-section}" class="btn btn-outline sidebar-link"
            style="justify-content: flex-start; border: none; width: 100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            Service Access
        </a>
        <a th:href="@{/dashboard#promotions-section}" class="btn btn-outline sidebar-link"
            style="justify-content: flex-start; border: none; width: 100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
            </svg>
            Elevations
        </a>
        <a id="nav-admin-onboardings" th:href="@{/onboarding}" class="btn btn-outline sidebar-link"
            th:style="${isAdmin != null and isAdmin} ? 'justify-content: flex-start; border: none; width: 100%;' : 'justify-content: flex-start; border: none; width: 100%; display: none;'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <polyline points="17 11 19 13 23 9" />
            </svg>
            Onboarding Requests
            <span id="nav-pending-onboardings-badge"
                  th:if="${pendingOnboardingsCount != null and pendingOnboardingsCount > 0}"
                  th:text="${pendingOnboardingsCount}"
                  class="badge"
                  style="margin-left: auto; background: var(--warning); color: black; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; font-weight: bold;">
            </span>
        </a>
        <a id="nav-admin-orgs" th:href="@{/dashboard#admin-org-section}" class="btn btn-outline sidebar-link"
            th:style="${isAdmin != null and isAdmin} ? 'justify-content: flex-start; border: none; width: 100%;' : 'justify-content: flex-start; border: none; width: 100%; display: none;'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 21h18M3 7v14M21 7v14M6 11h4M6 15h4M14 11h4M14 15h4M9 21v-4h6v4M3 7l9-4 9 4" />
            </svg>
            Organizations
        </a>
        <a th:href="@{/integrations}" class="btn btn-outline sidebar-link"
            style="justify-content: flex-start; border: none; width: 100%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            Integrations
        </a>
        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
            <p style="font-size: 0.75rem; color: var(--text-dim); text-align: center;">v1.0.4-stable</p>
        </div>
    </aside>

    <!-- Footer Fragment -->
    <footer th:fragment="footer"
        style="margin-top: 4rem; padding: 2rem; text-align: center; color: var(--text-dim); font-size: 0.875rem;">
        &copy; 2026 KitChome Platform. Built for Security & Scalability.
    </footer>
</body>

</html>
